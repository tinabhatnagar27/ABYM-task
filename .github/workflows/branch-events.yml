name: Branch Create/Delete Email

on:
  create:
    branches: ["*"]
  delete:
    branches: ["*"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send email on branch create/delete
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Branch Event: ${{ github.event.ref_type }} ${{ github.event.ref }}"
          body: "A branch was ${{ github.event_name }}d: ${{ github.event.ref }}"
          to: "your-email@example.com"
          from: "your-email@example.com"
